name: Release Python Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.repository == 'kplrm/speedport-api-expanded' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'kplrm' && github.triggering_actor == 'kplrm'
    uses: ./.github/workflows/python_check.yml

  build:
    needs: check
    if: >-
      github.repository == 'kplrm/speedport-api-expanded' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'kplrm' && github.triggering_actor == 'kplrm'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install build tools
      run: python -m pip install build twine setuptools
    - name: Check version
      id: version
      run: |
        version=$(python setup.py --version)
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
        if git show-ref --verify --quiet "refs/tags/v$version"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "Version $version already tagged; skipping release." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Build and validate package
      if: steps.version.outputs.changed == 'true'
      run: |
        python -m build
        python -m twine check dist/*
    - name: Store distributions
      if: steps.version.outputs.changed == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: python-package
        path: dist/
        if-no-files-found: error
        overwrite: true

  publish:
    needs: build
    if: >-
      needs.build.outputs.changed == 'true' &&
      github.repository == 'kplrm/speedport-api-expanded' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'kplrm' && github.triggering_actor == 'kplrm'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/speedport-api-expanded/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: python-package
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  release:
    needs: [build, publish]
    if: >-
      needs.build.outputs.changed == 'true' &&
      github.repository == 'kplrm/speedport-api-expanded' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'kplrm' && github.triggering_actor == 'kplrm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: python-package
        path: dist/
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.build.outputs.tag }}
      run: |
        gh release create "$RELEASE_TAG" dist/* \
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
          --title "$RELEASE_TAG" --generate-notes
